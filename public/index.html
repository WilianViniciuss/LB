<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lançamento de Boletos</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --tx:#1c2430; --mut:#6b7686; --bd:#dde1e8; --ac:#2457d6; --ok:#17803d; --er:#c62828; --wa:#b26a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181f; --card:#1d232d; --tx:#e6eaf0; --mut:#8b96a6; --bd:#2f3844; --ac:#6b95ff; --ok:#4cc27a; --er:#ff6b6b; --wa:#f0a53a; } }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.45 system-ui,Segoe UI,sans-serif }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 60px }
  h1 { font-size:20px; margin:0 0 16px }
  section { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:16px; margin-bottom:16px }
  h2 { font-size:14px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut) }
  textarea { width:100%; min-height:110px; resize:vertical; background:var(--bg); color:var(--tx); border:1px solid var(--bd); border-radius:8px; padding:10px; font:12px ui-monospace,Consolas,monospace }
  button { background:var(--ac); color:#fff; border:0; border-radius:8px; padding:8px 14px; font:inherit; cursor:pointer }
  button.sec { background:transparent; color:var(--tx); border:1px solid var(--bd) }
  button:disabled { opacity:.45; cursor:not-allowed }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px }
  .mut { color:var(--mut) }
  progress { width:200px }
  table { width:100%; border-collapse:collapse } th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--bd); vertical-align:top }
  th { font-size:12px; color:var(--mut); font-weight:600 }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid currentColor }
  .pendente { color:var(--mut) } .lancando { color:var(--wa) } .lancado { color:var(--ok) } .erro { color:var(--er) } .gravado { color:var(--ok) }
  .prob { color:var(--er); font-size:12px }
  .oc { font-size:12px; color:var(--mut) }
  .scroll { overflow-x:auto }
</style>
</head>
<body>
<main>
  <h1>Lançamento de Boletos</h1>

  <section>
    <h2>1 · Extração (segundo plano)</h2>
    <textarea id="links" placeholder="Cole os links dos boletos, um por linha (ou o conteúdo de um .txt)"></textarea>
    <div class="row">
      <input type="file" id="arq" accept=".txt" class="mut">
      <button id="bExtrair">Extrair</button>
      <progress id="prog" value="0" max="1" hidden></progress>
      <span id="progTxt" class="mut"></span>
      <button class="sec" id="bLimpar" style="margin-left:auto">Limpar lista</button>
    </div>
  </section>

  <section>
    <h2>2 · Via Imob</h2>
    <div class="row" style="margin-top:0">
      <button id="bVia">Abrir navegador do Via Imob</button>
      <span id="viaTxt" class="mut"></span>
    </div>
    <p class="mut" style="margin:10px 0 0">Faça login no navegador que abrir e deixe a tela <b>Manutenção encargo</b> visível na aba ativa. O lançamento preenche os campos; <b>a gravação é sempre manual</b>.</p>
  </section>

  <section>
    <h2>3 · Boletos</h2>
    <div class="row" style="margin:0 0 10px">
      <span id="resumo" class="mut"></span>
      <button id="bProx" style="margin-left:auto">Lançar próximo pendente</button>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>#</th><th>Cód.</th><th>Unidade</th><th>Ocorrências</th><th>Valor</th><th>Status</th><th></th></tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let E = { boletos: [], extracao: {}, via: {}, lancando: null };
const api = async (u, b) => { const r = await fetch(u, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b||{}) }); const j = await r.json(); if (!r.ok) alert(j.erro || 'Erro'); return j; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rot = { pendente:'Pendente', lancando:'Lançando…', lancado:'Preenchido', gravado:'Gravado', erro:'Erro' };

$('arq').onchange = async e => { const f = e.target.files[0]; if (f) $('links').value = await f.text(); };
$('bExtrair').onclick = async () => { await api('/api/extrair', { texto: $('links').value }); };
$('bLimpar').onclick = async () => { if (confirm('Apagar a lista de boletos?')) await api('/api/limpar'); };
$('bVia').onclick = async () => { $('bVia').disabled = true; await api('/api/via/abrir'); $('bVia').disabled = false; };
$('bProx').onclick = () => { const i = E.boletos.findIndex(b => b.status === 'pendente' && !b.problemas?.length); if (i < 0) return alert('Nenhum boleto pendente'); lancar(i); };
const lancar = async i => { const b = E.boletos[i]; if (!confirm(`Lançar ${b.codIdentificador} (${b.unidade})?\nConfirme que a tela Manutenção encargo está na aba ativa.`)) return; await api('/api/lancar', { indice: i }); };
window.marcar = (i, s) => api('/api/status', { indice: i, status: s });
window.lancar = lancar;

function render() {
  const x = E.extracao;
  $('prog').hidden = !x.rodando; $('prog').max = x.total || 1; $('prog').value = x.feitos || 0;
  $('progTxt').textContent = x.rodando ? `Extraindo ${x.feitos}/${x.total}…` : (x.erro ? 'Erro: ' + x.erro : '');
  $('bExtrair').disabled = x.rodando;
  $('viaTxt').textContent = E.via.aberto ? 'Navegador aberto' : '';
  const bs = E.boletos, n = s => bs.filter(b => b.status === s).length;
  $('resumo').textContent = `${bs.length} boletos · ${n('pendente')} pendentes · ${n('lancado')} preenchidos · ${n('gravado')} gravados · ${bs.filter(b => b.problemas?.length).length} com problema`;
  $('bProx').disabled = E.lancando !== null || !E.via.aberto;
  $('tb').innerHTML = bs.map((b, i) => {
    const prob = b.problemas?.length;
    const oc = (b.ocorrencias || []).map(o => `${esc(o.nome || o.itemOriginal)}: ${esc(o.valor)}${o.historico ? ' — ' + esc(o.historico) : ''}`).join('<br>');
    const st = prob ? 'erro' : b.status;
    const acoes = prob ? '' :
      b.status === 'lancado' ? `<button class="sec" onclick="marcar(${i},'gravado')">Marcar gravado</button> <button class="sec" onclick="lancar(${i})">Refazer</button>` :
      b.status === 'pendente' || b.status === 'erro' ? `<button class="sec" ${E.lancando !== null || !E.via.aberto ? 'disabled' : ''} onclick="lancar(${i})">Lançar</button>` : '';
    return `<tr><td>${i + 1}</td><td>${esc(b.codIdentificador || '—')}<div class="mut">${esc(b.condominio || '')}</div></td><td>${esc(b.unidade || '')}</td>
      <td class="oc">${oc}${b.desconto ? '<br><b>Desconto:</b> ' + esc(b.desconto.join(' | ')) : ''}</td>
      <td>${b.conferencia ? esc(b.conferencia.valorDocumento) : ''}</td>
      <td><span class="tag ${st}">${rot[st] || st}</span>${prob ? '<div class="prob">' + b.problemas.map(esc).join('<br>') + '</div>' : ''}${b.erroLancamento ? '<div class="prob">' + esc(b.erroLancamento) + '</div>' : ''}</td>
      <td>${acoes}</td></tr>`;
  }).join('') || '<tr><td colspan="7" class="mut">Nenhum boleto ainda.</td></tr>';
}
async function tick() { try { E = await (await fetch('/api/estado')).json(); render(); } catch {} setTimeout(tick, 1000); }
tick();
</script>
</body>
</html>
